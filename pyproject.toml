[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlflow-langchain-enrichment"
version = "0.1.0"
description = "Helpers for enriching MLflow 3 LangChain autolog traces."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Bin Zhang" }
]
dependencies = [
  "mlflow>=3.0.0",
  "langchain",
  "langchain-core==1.2.17",
  "langchain-ollama>=0.2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
